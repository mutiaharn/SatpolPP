# ==============================================================================
# Nginx Production Reverse Proxy & TLS Hardening
# Satpol PP Provinsi Sulawesi Selatan & SIAP TERTIB
# ==============================================================================

# Edge Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=complaint_submit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_general:20m rate=60r/m;

# Proxy Cache for Public Media & Documents from RustFS
proxy_cache_path /var/cache/nginx/rustfs levels=1:2 keys_zone=rustfs_cache:10m max_size=500m inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name satpolpp.sulselprov.go.id siaptertib.sulselprov.go.id _;
    server_tokens off;

    # ACME Challenge for Certbot Auto-SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Force HTTPS Redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name satpolpp.sulselprov.go.id siaptertib.sulselprov.go.id _;
    server_tokens off;

    # TLS Certificates (Mount Diskominfo Wildcard atau Let's Encrypt ke /etc/nginx/ssl/)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.key;

    # Modern TLS 1.2 & 1.3 Hardening (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Upload Body Limit (Bukti 5MB + Dokumen PDF/DOCX hingga 25MB)
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Strict Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Brute-Force Protection on Admin Login
    location = /api/v1/auth/login {
        limit_req zone=auth_login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080/api/v1/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Flood Protection on Public Complaint Submission
    location = /api/v1/complaints {
        limit_req zone=complaint_submit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080/api/v1/complaints;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend REST API
    location /api/ {
        limit_req zone=api_general burst=30 nodelay;

        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Cached Public Media & Documents Proxy (RustFS Public Buckets Only)
    # Note: siaptertib-evidence (PRIVATE) is NEVER exposed here; served via authenticated /api/v1/admin/evidence/
    location ~ ^/storage/(portal-media|portal-documents)/(.*)$ {
        proxy_pass http://rustfs:9000/$1/$2$is_args$args;
        proxy_cache rustfs_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_set_header Host rustfs:9000;
    }

    # Frontend SvelteKit SSR
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
