# ==============================================================================
# Development Override: Mailpit, Localhost DB/RustFS Debug Ports, & HTTP Nginx
# Jalankan dengan:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# ==============================================================================

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  pgbouncer:
    ports:
      - "127.0.0.1:6432:5432"

  rustfs:
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"

  # Local SMTP Sink & Web UI (http://localhost:8025)
  mailpit:
    image: axllent/mailpit:latest
    container_name: satpol_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - edge_net

  backend:
    environment:
      APP_ENV: development
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: noreply@satpolpp.sulselprov.go.id

  nginx:
    ports: !override
      - "8088:80"
    volumes:
      - ./docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_cache:/var/cache/nginx
