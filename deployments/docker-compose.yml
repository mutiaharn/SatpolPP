# ==============================================================================
# SATPOL PP SULSEL & SIAP TERTIB - PRODUCTION INFRASTRUCTURE STACK
# 3-Zone Network Isolation: edge_net (DMZ) & data_net (internal: true)
# ==============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  # 1. PostgreSQL 16 (Primary ACID Database)
  postgres:
    image: postgres:16-alpine
    container_name: satpol_postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-satpolpp_sulsel_db}
      POSTGRES_USER: ${POSTGRES_USER:-satpolpp_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${TZ:-Asia/Makassar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-satpolpp_app} -d ${POSTGRES_DB:-satpolpp_sulsel_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. PgBouncer (Transaction Connection Pooler)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: satpol_pgbouncer
    restart: unless-stopped
    logging: *default-logging
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-satpolpp_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${POSTGRES_DB:-satpolpp_sulsel_db}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25
      RESERVE_POOL_SIZE: 5
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-satpolpp_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Prisma Database Migrator (One-Shot Init Container)
  db-migrator:
    build:
      context: ../database
      dockerfile: Dockerfile.migrator
    container_name: satpol_db_migrator
    restart: "no"
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-satpolpp_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-satpolpp_sulsel_db}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data_net

  # 4. RustFS (S3-Compatible Object Storage)
  rustfs:
    image: rustfs/rustfs:latest
    container_name: satpol_rustfs
    restart: unless-stopped
    logging: *default-logging
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_ROOT_USER:-satpol_s3_admin}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_ROOT_PASSWORD:?RUSTFS_ROOT_PASSWORD is required}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - rustfs_data:/data
    networks:
      - data_net
      - edge_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # 5. Golang Unified Backend API
  backend:
    build:
      context: ../backend
      dockerfile: ../deployments/docker/Dockerfile.backend
    container_name: satpol_backend_api
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: ${APP_PORT:-8080}
      TZ: ${TZ:-Asia/Makassar}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?PII_ENCRYPTION_KEY is required}
      DB_DRIVER: postgres
      DB_HOST: pgbouncer
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-satpolpp_app}
      DB_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${POSTGRES_DB:-satpolpp_sulsel_db}
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: ${S3_REGION:-ap-southeast-1}
      S3_ACCESS_KEY: ${RUSTFS_ROOT_USER:-satpol_s3_admin}
      S3_SECRET_KEY: ${RUSTFS_ROOT_PASSWORD:?RUSTFS_ROOT_PASSWORD is required}
      S3_BUCKET_EVIDENCE: ${S3_BUCKET_EVIDENCE:-siaptertib-evidence}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-portal-documents}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-portal-media}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@satpolpp.sulselprov.go.id}
    depends_on:
      pgbouncer:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
    networks:
      - data_net
      - edge_net

  # 7. SvelteKit SSR Frontend
  frontend:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.frontend
    container_name: satpol_frontend_web
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: 3000
      ORIGIN: ${PUBLIC_SITE_URL:-https://satpolpp.sulselprov.go.id}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge_net

  # 8. Nginx Edge Reverse Proxy & TLS Termination (Only Public-Facing Container)
  nginx:
    image: nginx:1.27-alpine
    container_name: satpol_nginx_edge
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - edge_net

  # 9. Optional Self-Hosted SMTP Relay (Aktifkan dengan: docker compose --profile selfhosted-mail up -d)
  smtp-relay:
    image: boky/postfix:latest
    container_name: satpol_smtp_relay
    profiles: ["selfhosted-mail"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      ALLOWED_SENDER_DOMAINS: ${SMTP_DOMAIN:-satpolpp.sulselprov.go.id}
      HOSTNAME: mail.${SMTP_DOMAIN:-satpolpp.sulselprov.go.id}
    networks:
      - edge_net

volumes:
  postgres_data:
  rustfs_data:
  nginx_cache:

networks:
  edge_net:
    driver: bridge
  data_net:
    driver: bridge
    internal: true
