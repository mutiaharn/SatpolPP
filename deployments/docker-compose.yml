version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../deployments/docker/Dockerfile.backend
    container_name: satpol_backend_api
    restart: always
    environment:
      - PORT=8080
      - GIN_MODE=release
      - DB_TYPE=sqlite
      - DB_PATH=/app/data/satpol.db
    volumes:
      - satpol_data:/app/data
    ports:
      - "8080:8080"
    networks:
      - satpol_network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deployments/docker/Dockerfile.frontend
    container_name: satpol_frontend_web
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - satpol_network

  nginx:
    image: nginx:alpine
    container_name: satpol_reverse_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - satpol_network

volumes:
  satpol_data:

networks:
  satpol_network:
    driver: bridge
